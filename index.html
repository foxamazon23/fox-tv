<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOX TV</title>
<meta name="description" content="FOX TV — canale TV românești live, de Mihai Vulpe">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>
:root{
--bg:#000;--panel:#0b0b0b;--panel-2:#151515;--panel-3:#1e1e1e;
--border:#262626;--border-hi:#3a3a3a;
--text:#f5f5f5;--muted:#9a9a9a;--muted-2:#626262;
--accent:#ff6a00;--accent-2:#ff8c2a;--glow:rgba(255,106,0,.35);
--ok:#3fb950;--err:#f85149;--gold:#ffd23f;
--side:400px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
/* header */
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0e0e0e,#000)}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand svg{width:38px;height:38px;filter:drop-shadow(0 0 8px var(--glow))}
.brand b{font-size:22px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.install{display:none;padding:9px 14px;border-radius:10px;background:var(--accent);color:#000;font-weight:700;font-size:14px;white-space:nowrap}
.install.show{display:block}
/* layout */
main{display:grid;grid-template-columns:var(--side) 1fr;min-height:0}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--panel);order:1}
.player{order:2;display:flex;flex-direction:column;min-width:0;min-height:0;background:#000}
.chips{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--border-hi)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#000}
.count{padding:8px 16px 4px;font-size:12px;color:var(--muted-2);letter-spacing:1px;text-transform:uppercase}
.list{flex:1;overflow-y:auto;padding:4px 8px 16px;overscroll-behavior:contain}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;outline:none;user-select:none}
.row:hover{background:var(--panel-2)}
.row.kfocus{background:var(--panel-2);border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.row:focus-visible{background:var(--panel-2);border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.row.playing{background:linear-gradient(90deg,rgba(255,106,0,.18),rgba(255,106,0,.03));box-shadow:inset 4px 0 0 var(--accent)}
.logo{width:44px;height:44px;border-radius:9px;background:var(--panel-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--accent);flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.row.playing .logo{border-color:var(--accent)}
.meta{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;border:1px solid}
.badge.hd{color:var(--accent);border-color:rgba(255,106,0,.45)}
.badge.fhd{color:var(--ok);border-color:rgba(63,185,80,.45)}
.star{width:34px;height:34px;border-radius:8px;font-size:18px;color:var(--muted-2);flex-shrink:0}
.star:hover{background:var(--panel-3)}
.star.on{color:var(--gold)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
/* player */
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0b0b0b,#000 70%)}
video{width:100%;height:100%;object-fit:contain;background:#000;display:none}
video.fill{object-fit:cover}
.ph{text-align:center;padding:24px;max-width:520px;color:var(--muted)}
.ph svg{width:110px;height:110px;margin-bottom:18px;opacity:.6;filter:drop-shadow(0 0 22px var(--glow))}
.ph h2{font-size:24px;color:var(--text);margin-bottom:8px}
.ph h2 span{color:var(--accent)}
.ph p{font-size:15px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;margin:14px 4px 0}
.btn.pri{background:var(--accent);color:#000}
.btn.sec{border:1px solid var(--border-hi);color:var(--text)}
.spin{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;pointer-events:none}
.spin.show{display:flex}
.spin svg{width:56px;height:56px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.err{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);text-align:center;padding:24px}
.err.show{display:flex}
.err h3{font-size:18px;margin-bottom:6px}
.err p{color:var(--muted);font-size:14px}
.osd{position:absolute;top:14px;left:14px;padding:10px 16px;border-radius:10px;background:rgba(0,0,0,.75);border-left:4px solid var(--accent);backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;pointer-events:none}
.osd.show{opacity:1}
.osd b{color:var(--accent);font-size:18px}
.osd div{color:var(--muted);font-size:13px;margin-top:2px}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);flex-shrink:0}
.dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:p 1.5s infinite}
.dot.load{background:var(--accent);animation:p .8s infinite}
.dot.bad{background:var(--err)}
@keyframes p{50%{opacity:.35}}
.now{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{color:var(--accent)}
.ib{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ib:hover{color:var(--text);border-color:var(--border-hi)}
.ib.on{color:var(--accent);border-color:var(--accent)}
.ib svg{width:18px;height:18px}
@media (min-width:861px){.chips{flex-wrap:wrap}}
/* phone */
@media (max-width:860px){
 body{overflow:auto}
 .app{height:auto;min-height:100vh;min-height:100dvh;display:block}
 header{position:sticky;top:0;z-index:5;padding:10px 12px;gap:10px}
 .brand small{display:none}
 .brand b{font-size:19px}
 .brand svg{width:32px;height:32px}
 main{display:flex;flex-direction:column}
 .player{order:1;position:sticky;top:57px;z-index:4}
 .stage{flex:none;aspect-ratio:16/9;width:100%}
 .ph svg{width:64px;height:64px;margin-bottom:8px}
 .ph h2{font-size:18px}
 .ph p{font-size:13px}
 aside{order:2;border-right:0}
 .list{overflow:visible}
 .row{padding:10px 8px}
}
@media (max-width:480px){ .install{padding:8px 10px;font-size:13px} .search input{font-size:16px} }
/* TV (Samsung) */
body.tv{font-size:20px}
body.tv{--side:560px}
body.tv .row{padding:14px 16px}
body.tv .name{font-size:22px}
body.tv .sub{font-size:16px}
body.tv .logo{width:58px;height:58px}
body.tv .chip{font-size:18px;padding:10px 18px}
body.tv .star{display:none}
body.tv .stage,body.tv .player,body.tv video{background:transparent}
body.tv .stage{min-height:560px}
body.tv video{object-fit:fill;width:auto;height:auto}
body.tv .count{font-size:14px}
.dbg{position:fixed;left:10px;bottom:10px;z-index:99;background:rgba(0,0,0,.88);color:#7CFC00;font:15px/1.35 monospace;padding:8px 12px;max-width:70vw;white-space:pre-wrap;display:none;border:1px solid #444;border-radius:8px}
.dbg.show{display:block}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(20,20,20,.95);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:10px;font-size:15px;display:none;z-index:9;max-width:90%;text-align:center}
.toast.show{display:block}
body.tv .osd{backdrop-filter:none;background:rgba(0,0,0,.85)}
body.tv .chip.kfocus{outline:3px solid var(--accent);outline-offset:2px}
/* TV layout: video full-screen, channel panel as overlay that auto-hides */
body.tv header{display:none}
body.tv .app{display:block;height:100vh;padding:0}
body.tv main{display:block;height:100vh}
body.tv .player{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1}
body.tv .stage{position:absolute;left:0;top:0;right:0;bottom:0;min-height:0}
body.tv .ph{margin-left:40vw;color:#ccc}
body.tv .ph p{font-size:20px;max-width:640px}
body.tv aside{position:fixed;left:0;top:0;bottom:0;width:40vw;max-width:760px;z-index:4;background:rgba(6,6,6,.88);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .25s ease}
body.tv .tvtitle{display:flex;align-items:center;gap:14px;padding:18px 22px 6px}
body.tv .tvtitle svg{width:44px;height:44px}
body.tv .tvtitle b{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--accent)}
body.tv .tvtitle small{display:block;font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
body.tv .chips{flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border)}
body.tv .count{padding:10px 24px 4px}
body.tv .list{overflow-y:auto;padding:6px 14px 20px;scrollbar-width:none}
body.tv .list::-webkit-scrollbar{display:none}
body.tv .row{padding:14px 16px;border-width:2px}
body.tv .row.kfocus{transform:scale(1.02);box-shadow:0 0 0 2px var(--accent),0 0 22px var(--glow)}
body.tv .tvhint{padding:14px 22px;border-top:1px solid var(--border);color:var(--muted);font-size:16px;line-height:1.7;background:rgba(0,0,0,.5)}
body.tv .tvhint b{display:inline-block;min-width:34px;padding:1px 8px;margin-right:4px;border:1px solid var(--border-hi);border-radius:6px;color:var(--text);text-align:center;font-size:15px}
body.tv .bar{position:absolute;right:28px;bottom:28px;left:auto;top:auto;z-index:3;background:rgba(0,0,0,.78);border:1px solid var(--border);border-radius:16px;padding:12px 14px;gap:12px;transition:opacity .25s}
body.tv .bar .now,body.tv .bar .dot{display:none}
body.tv .ib{width:auto;height:56px;padding:0 18px;font-size:19px;font-weight:600;gap:10px;border-radius:12px;color:var(--text);background:rgba(255,255,255,.04)}
body.tv .ib::after{content:attr(data-l)}
body.tv .ib svg{width:24px;height:24px}
body.tv .osd{left:auto;right:28px;top:28px;padding:16px 24px;border-left-width:6px;background:rgba(0,0,0,.85)}
body.tv .osd b{font-size:30px}
body.tv .osd div{font-size:18px}
body.tv .toast{bottom:110px;font-size:20px;padding:14px 24px}
body.tv .dbg{left:auto;right:28px;bottom:110px;max-width:56vw;font-size:14px}
body.tv .err h3{font-size:28px}
body.tv .err p{font-size:18px}
body.tv .err .btn{font-size:18px;padding:14px 24px}
body.tv.ui-hidden aside{transform:translateX(-100%)}
body.tv.ui-hidden .bar{opacity:0;pointer-events:none}
</style>
</head>

 const q = query.trim().toLowerCase();
 if(q) b = b.filter(c=>c.n.toLowerCase().includes(q)||c.c.toLowerCase().includes(q));

   bad=0;
   const ab=v.webkitAudioDecodedByteCount;
   if(typeof ab==='number' && ab===0 && !v.muted && v.currentTime>5){ if(++badA>=3){ clearInterval(wd); wd=null; noMedia(c,'audio'); } return; }
   badA=0;
   if(autoStage>0 && autoStage<3){ store.set('foxtv_mode',usedMode); store.set('foxtv_lowq',lowQ); mode=usedMode; clearInterval(wd); wd=null; }
  } },1500);
}
function fail(){
 $('spin').classList.remove('show'); status('bad');
 $('errT').textContent=`${cur.n} nu merge acum`;
 $('err').classList.add('show');
}
function play(c, keepTries){
 if(!c) return;
 if(!keepTries){ tries=0; autoStage=0; forceMode=null; }
 cur=c; stop(); v.muted=false; pendingUnmute=false;
 $('ph').style.display='none'; $('err').classList.remove('show'); showUi();
 v.style.display='block'; $('spin').classList.add('show'); status('load');
 $('now').innerHTML=`<span>${esc(c.n)}</span> · ${esc(c.q)}`;
 document.title=`${c.n} · FOX TV`;
 osd(c);
 recent=[c.n,...recent.filter(n=>n!==c.n)].slice(0,20); store.set('foxtv_recent2',recent); store.set('foxtv_last2',c.n);
 const vi=view.indexOf(c); if(vi>=0) kidx=vi;
 renderList();
 const ok=()=>{ $('spin').classList.remove('show'); status('live'); tries=0; showUi(); };
 const hlsOk = !!(window.Hls && Hls.isSupported());
 const want = forceMode || mode;
 let useNative = want==='nativ' ? NATIVE_HLS : want==='hls' ? !hlsOk : (NATIVE_HLS && (IS_TV || !hlsOk));
 if(useNative && !NATIVE_HLS) useNative=false;
 usedMode = useNative ? 'nativ' : (hlsOk ? 'hls' : 'niciunul');
 fitTv(); watchdog(c);
 if(useNative){
  v.src=c.u;
  v.addEventListener('playing',ok,{once:true});
  v.onerror=()=>{ if(cur!==c) return; lastHlsErr='nativ err '+(v.error?v.error.code:'?'); if(hlsOk && !c.tv && tries<1){ tries++; stop(); usedMode='hls'; playHls(c,ok); watchdog(c); } else fail(); };
  tryPlay();
 } else if(window.Hls && Hls.isSupported()){ playHls(c,ok); }
 else { fail(); $('errP').textContent='Dispozitivul nu suportă redarea HLS.'; }
}
function playHls(c,ok){
 {
  const cfg={enableWorker:!IS_TV,maxBufferLength:IS_TV?20:30,maxMaxBufferLength:IS_TV?40:60,backBufferLength:30,manifestLoadingMaxRetry:2,levelLoadingMaxRetry:2,fragLoadingMaxRetry:3};
  if(lowQ){ cfg.startLevel=0; cfg.autoLevelCapping=0; }
  hls=new Hls(cfg);
  hls.loadSource(c.u); hls.attachMedia(v);
  hls.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{
   const ac=((d&&d.levels)||[]).map(l=>l.audioCodec||'').join(',');
   if(IS_TV && NATIVE_HLS && !forceMode && /mp4a\.40\.34|mp3|ac-3|ec-3/i.test(ac) && mse('audio/mp4;codecs="mp4a.40.34"')!=='da'){ forceMode='nativ'; autoStage=1; toast('Audio '+ac+' → player nativ',4000); setTimeout(()=>{ if(cur===c) play(c,true); },0); return; }
   tryPlay(); });
  hls.on(Hls.Events.FRAG_BUFFERED,ok);
  hls.on(Hls.Events.ERROR,(e,d)=>{ lastHlsErr=(d.fatal?'FATAL ':'')+d.type+'/'+d.details; if(!d.fatal||cur!==c) return;
   if(d.type===Hls.ErrorTypes.MEDIA_ERROR && tries<1){ tries++; hls.recoverMediaError(); return; }
   if(d.type===Hls.ErrorTypes.NETWORK_ERROR && tries<1){ tries++; setTimeout(()=>{ if(cur===c) play(c,true); },1500); return; }
   fail();
  });
 }
}
function step(d){ const L=view.length?view:ALL; let i=L.indexOf(cur); i=(i<0?0:(i+d+L.length)%L.length); play(L[i]); }
function setCat(c){ cat=c; kidx=0; renderChips(); filter(); listEl.scrollTop=0; }

$('chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(b) setCat(CATS[+b.dataset.i]); });
listEl.addEventListener('click',e=>{
 const s=e.target.closest('[data-star]'); if(s){ e.stopPropagation(); const c=view[+s.dataset.star]; favs=favs.includes(c.n)?favs.filter(n=>n!==c.n):[...favs,c.n]; store.set('foxtv_favs2',favs); cat==='★ Favorite'?filter():renderList(); return; }
 const r=e.target.closest('.row'); if(r){ play(view[+r.dataset.i]); if(innerWidth<=860) scrollTo({top:0,behavior:'smooth'}); }
});
listEl.addEventListener('keydown',e=>{ const r=e.target.closest('.row'); if(!r) return;
 if(e.key==='Enter'||e.key===' '){ e.preventDefault(); play(view[+r.dataset.i]); }
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const n=e.key==='ArrowDown'?r.nextElementSibling:r.previousElementSibling; if(n) n.focus(); }
});
$('q').addEventListener('input',e=>{ query=e.target.value; filter(); });
$('retry').onclick=()=>play(cur); $('skip').onclick=()=>step(1);
$('prev').onclick=()=>step(-1); $('next').onclick=()=>step(1);
$('fill').onclick=()=>{ v.classList.toggle('fill'); $('fill').classList.toggle('on'); };
$('fs').onclick=()=>{ const s=$('stage'); if(document.fullscreenElement) document.exitFullscreen(); else if(s.requestFullscreen) s.requestFullscreen().catch(()=>{}); else if(v.webkitEnterFullscreen) v.webkitEnterFullscreen(); };
$('stage').addEventListener('dblclick',()=>$('fs').click());
v.addEventListener('volumechange',()=>{});

// keyboard (PC) + Samsung remote
document.addEventListener('keydown',e=>{
 const k=e.keyCode, typing=document.activeElement===$('q');
 unmuteIfPending();
 const wasHidden = IS_TV ? showUi() : false;
 if(k===427||k===33){ e.preventDefault(); step(-1); return; }      // CH- / PageUp
 if(k===428||k===34){ e.preventDefault(); step(1); return; }       // CH+ / PageDown
 if(!typing && (k===48||k===96)){ e.preventDefault(); $('dbg').classList.toggle('show'); updateDbg(); return; }           // 0 = diagnostic
 if(!typing && (k===49||k===97)){ e.preventDefault(); mode = mode===null?'nativ':mode==='nativ'?'hls':null; store.set('foxtv_mode',mode); toast('Player: '+(mode||'auto')); if(cur) play(cur); return; }  // 1 = player
 if(!typing && (k===50||k===98)){ e.preventDefault(); lowQ=!lowQ; store.set('foxtv_lowq',lowQ); toast('Calitate mică: '+(lowQ?'DA':'NU')); if(cur) play(cur); return; }   // 2 = calitate
 if(!IS_TV) return;
 if(wasHidden && (k===38||k===40||k===13||k===37||k===39)){ e.preventDefault(); return; }
 if($('err').classList.contains('show') && k===13){ e.preventDefault(); play(cur); return; }
 if(typing){ if(k===13||k===40){ e.preventDefault(); $('q').blur(); } return; }
 if(k===38){ e.preventDefault(); if(kidx>0){kidx--; renderList();} }
 else if(k===40){ e.preventDefault(); if(kidx<view.length-1){kidx++; renderList();} }
 else if(k===37||k===39){ e.preventDefault(); const i=CATS.indexOf(cat); setCat(CATS[(i+(k===39?1:-1)+CATS.length)%CATS.length]); }
 else if(k===13){ e.preventDefault(); play(view[kidx]); }
 else if(k===10009||k===27){ e.preventDefault(); if(query){ query=''; $('q').value=''; filter(); } else { try{ tizen.application.getCurrentApplication().exit(); }catch(err){} } }
});
if(IS_TV){
 document.body.classList.add('tv');
 try{ ['ChannelUp','ChannelDown'].forEach(n=>tizen.tvinputdevice.registerKey(n)); }catch(e){}
 $('phText').textContent='Alege un canal din panoul din stânga. Panoul se ascunde singur când rulează un canal; apasă orice tastă ca să revină.';
 $('tvtitle').style.display='flex'; $('tvhint').style.display='block';
 document.addEventListener('mousemove',()=>showUi()); document.addEventListener('click',()=>{ unmuteIfPending(); showUi(); });
 fitTv();
} else {
 v.controls=true;
}

// install as app (PWA)
let deferred=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('install').classList.add('show'); });
$('install').onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('install').classList.remove('show'); };
addEventListener('appinstalled',()=>$('install').classList.remove('show'));
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

// init
renderChips(); filter();
if(/debug/.test(location.search)){ $('dbg').classList.add('show'); updateDbg(); }
const last=ALL.find(c=>c.n===store.get('foxtv_last2',''));
if(last){
 if(IS_TV) setTimeout(()=>play(last),400);
 else { $('resume').innerHTML=`<button class="btn pri" id="res">▶ Continuă: ${esc(last.n)}</button>`; $('res').onclick=()=>play(last); }
}
</script>
